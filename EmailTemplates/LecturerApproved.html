<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color: #0f1829; color: #e7eefc; padding: 40px; text-align: center;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #1a263d; padding: 30px; border-radius: 12px; border-top: 4px solid #00f3ff;">
        <h1 style="color: #00f3ff;">Welcome to the Team, {LecturerName}!</h1>
        <p style="font-size: 16px; line-height: 1.6; color: #a9b8d6;">
            Great news! Your application to become a Lecturer at Python Academy has been officially <strong>approved</strong> by our administration team.
        </p>
        <p style="font-size: 16px; line-height: 1.6; color: #a9b8d6;">
            You can now log in, create modules, upload content, and grade your students.
        </p>
        <a href="{LoginUrl}" style="display: inline-block; background-color: #00f3ff; color: #000; padding: 14px 28px; font-weight: bold; text-decoration: none; border-radius: 8px; margin-top: 20px;">
            Go to My Dashboard
        </a>
    </div>
</body>
</html>
